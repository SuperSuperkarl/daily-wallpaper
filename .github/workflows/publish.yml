name: Publish wallpaper to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 04:05 UTC (05:05 winter / 06:05 summer in Germany).
    # Intended to finish before the 06:30 iPhone shortcut.
    - cron: '5 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update daily lock-screen text
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/update_daily_text.py

      - name: Generate new wallpaper (scheduled or manual runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2.5-flare
        run: python scripts/generate_wallpaper.py

      - name: Commit updated daily content
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "$(git status --porcelain -- public/lockscreen.png public/daily-text.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/daily-text.txt
            if [ -f public/lockscreen.png ]; then git add public/lockscreen.png; fi
            git commit -m "Update daily wallpaper and widget text"
            git push
          else
            echo "No updated daily content to commit"
          fi

      - name: Install demo-image dependency
        if: hashFiles('public/lockscreen.png') == ''
        run: python -m pip install 'Pillow>=11,<13'

      - name: Prepare Pages content
        run: |
          mkdir -p public site
          if [ ! -f public/lockscreen.png ]; then
            python scripts/create_demo_wallpaper.py public/lockscreen.png
          fi
          cp -R public/. site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
